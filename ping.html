    function rankingView(){const list=[...state.players].sort((a,b)=>b.elo-a.elo);return `<section class="card page"><div class="sectionhead"><div><p class="kicker">Après ${state.history.length} tournoi${state.history.length>1?'s':''}</p><h2>Classement général</h2></div><span class="pill">Coefficient K = 24</span></div><div class="board">${list.map((p,i)=>`<div class="leader ${i<3?'top':''}"><span class="place p${i+1}">${i+1}</span>${avatar(p)}<span><strong>${esc(p.name)}</strong><small>${i?'Écart : '+(list[i-1].elo-p.elo)+' pts':'Leader du club'}</small></span><button class="eloEdit" onclick="openEloEditor('${p.id}')" title="Modifier l’Elo de ${esc(p.name)}"><strong>${p.elo}</strong><small>Modifier</small></button></div>`).join('')}</div></section>`}
    function rulesView(){return `<section class="card page"><div class="sectionhead"><div><p class="kicker">Règlement complet</p><h2>Comment fonctionne le tournoi&nbsp;?</h2></div><span class="pill">4 tours · Elo K24</span></div><div class="rulesLead">Chaque tournoi se joue normalement en quatre tours. Avant de commencer, l’organisateur sélectionne les joueurs présents. Les appariements cherchent à faire jouer des adversaires de niveau différent au premier tour, puis des joueurs ayant le même nombre de victoires aux tours suivants, tout en évitant les revanches.</div><div class="rulesGrid">
      <article class="ruleBlock"><span class="ruleNum">1</span><h3>Présences et lancement</h3><ul><li>Seuls les membres cochés dans «&nbsp;Qui joue aujourd’hui&nbsp;?&nbsp;» participent au tournoi.</li><li>Le classement Elo détermine l’ordre des têtes de série et départage les choix de repêchage.</li><li>Dans le déroulement normal, chaque joueur dispute un match par tour, sauf le volontaire du groupe à 0 victoire.</li><li>Un tournoi s’arrête après le quatrième tour, ou plus tôt s’il reste moins de deux joueurs en lice.</li></ul></article>
      <article class="ruleBlock"><span class="ruleNum">2</span><h3>Formation des groupes</h3><ul><li>Au premier tour, la moitié la mieux classée à l’Elo rencontre, par tirage, la moitié la moins bien classée.</li><li>Avant les tours 2, 3 et 4, les joueurs sont regroupés selon leur nombre V de victoires comptabilisées dans le tournoi.</li><li>Le tirage est alors entièrement aléatoire au sein de chaque groupe, sans tenir compte de l’Elo.</li><li>Après le troisième tour, les groupes possibles sont V&nbsp;=&nbsp;3, 2, 1 et 0.</li></ul></article>
      <article class="ruleBlock"><span class="ruleNum">3</span><h3>Repêchages montants</h3><ul><li>Si le groupe V est impair et V&nbsp;&gt;&nbsp;0, le meilleur Elo provisoire du groupe V−1 est repêché dans le groupe V.</li><li>Ce joueur est retiré du groupe V−1 et ne dispute qu’un seul match pendant le tour.</li><li>L’opération est appliquée du groupe le plus élevé vers le groupe V&nbsp;=&nbsp;1 et peut donc se propager entre plusieurs groupes.</li><li>Une victoire du joueur repêché est comptée normalement dans son total.</li></ul></article>
      <article class="ruleBlock"><span class="ruleNum">4</span><h3>Volontaire du groupe V = 0</h3><ul><li>Si le groupe V&nbsp;=&nbsp;0 reste impair, l’organisateur peut choisir comme volontaire n’importe quel joueur encore présent, quel que soit son nombre de victoires.</li><li>Le volontaire conserve son match normal et joue un second match dans le groupe V&nbsp;=&nbsp;0.</li><li>S’il gagne ce match supplémentaire, cette victoire n’est pas ajoutée à son total. Si son adversaire gagne, sa victoire est comptée normalement.</li><li>L’Elo du volontaire ne change jamais à cause de ce match supplémentaire. Seul son adversaire gagne ou perd des points selon le résultat.</li></ul><p class="ruleNote">Le match supplémentaire du volontaire est la seule rencontre autorisée à reproduire une affiche déjà jouée pendant le tournoi.</p></article>
      <article class="ruleBlock"><span class="ruleNum">5</span><h3>Pas de revanche</h3><ul><li>Deux joueurs ne peuvent pas se rencontrer plus d’une fois au cours du même tournoi, sauf dans le match supplémentaire du volontaire.</li><li>Le tirage recherche d’abord des rencontres strictement internes aux groupes de victoires.</li><li>Si cela ne permet pas d’apparier tout le monde sans revanche, l’application autorise le plus petit écart nécessaire entre groupes.</li><li>Ces rencontres exceptionnelles sont signalées dans le tableau par la mention «&nbsp;Anti-revanche&nbsp;».</li></ul></article>
      <article class="ruleBlock"><span class="ruleNum">6</span><h3>Tirage et résultats</h3><ul><li>Tant qu’au moins deux rencontres restent à jouer, «&nbsp;Modifier le tirage&nbsp;» permet d’échanger manuellement deux joueurs entre des matchs non joués.</li><li>Les matchs déjà joués sont verrouillés. Une modification créant un auto-match ou une revanche interdite est refusée.</li><li>Le rôle de volontaire suit le joueur lors d’un échange et les modifications manuelles sont signalées dans le tableau.</li><li>Après chaque rencontre, l’organisateur clique sur le vainqueur. Il peut corriger ce choix en cliquant ensuite sur l’autre joueur.</li></ul></article>
      <article class="ruleBlock"><span class="ruleNum">7</span><h3>Elo et classement final</h3><ul><li>Chaque match normal fait évoluer l’Elo des deux joueurs avec un coefficient K&nbsp;=&nbsp;24. Dans le match supplémentaire, l’Elo du volontaire reste inchangé.</li><li>L’Elo est recalculé rencontre après rencontre, dans l’ordre où les tours et les matchs sont enregistrés.</li><li>Le classement final trie d’abord par nombre de victoires, puis utilise les confrontations directes. Si elles ne suffisent pas, les joueurs restent ex æquo&nbsp;: l’Elo ne les départage pas.</li><li>Chaque Elo peut être corrigé manuellement depuis «&nbsp;Joueurs&nbsp;» ou «&nbsp;Classement&nbsp;». Celui d’un participant est verrouillé pendant son tournoi.</li></ul></article>
      <article class="ruleBlock"><span class="ruleNum">8</span><h3>Départs, historique et données</h3><ul><li>«&nbsp;Départs / blessures&nbsp;» permet de retirer un ou plusieurs joueurs pendant un tour.</li><li>Leurs résultats déjà saisis restent acquis&nbsp;; leurs matchs non joués sont annulés et le reste du tour est recalculé sans victoire ni variation Elo artificielle.</li><li>Les tours peuvent être consultés pendant le tournoi et depuis l’historique après sa fin. Trois récapitulatifs PDF A4 peuvent alors être téléchargés.</li><li>Effectif, Elo, tournoi en cours et historique restent dans le stockage local. Le menu des données permet de sauvegarder, transférer ou effacer l’historique, avec conservation facultative des joueurs et de leur Elo.</li></ul></article>
    </div><div class="rulesFoot"><strong>En résumé&nbsp;:</strong> le nombre de victoires organise les groupes des tours 2 à 4, dont le tirage est aléatoire. L’Elo prépare le premier tour, détermine les repêchages et assure le classement permanent d’une semaine à l’autre. Aucune donnée n’est envoyée à un serveur.</div></section>`}
    function historyView(){if(reviewHistoryId){const item=state.history.find(h=>h.id===reviewHistoryId);if(item)return historyReviewView(item);reviewHistoryId=null}return `<section class="card page"><div class="sectionhead"><div><p class="kicker">Archives locales</p><h2>Tournois précédents</h2></div></div><div class="rows">${state.history.length?state.history.map(h=>{const source=pdfTournamentSource(h.id),ranking=source?pdfRankingData(source.t,source.resolve):null,leaders=ranking?.groups[0],bestDirect=leaders?.ids.length?leaders.direct[leaders.ids[0]]:null,winnerIds=leaders?.ids.filter(pid=>leaders.direct[pid]===bestDirect)||(h.winners?.length?h.winners:h.winner?[h.winner]:[]),winners=winnerIds.map(pid=>(h.roster||[]).find(x=>x.id===pid)||player(pid)),p=winners[0],date=new Intl.DateTimeFormat('fr-FR').format(new Date(h.date+'T12:00:00'));return`<div class="history"><span><strong>${date}</strong><small>${h.playerCount} joueurs · ${h.rounds.flat().length} matchs</small></span>${p?`<span class="who">${avatar(p)}<span><small>${winners.length>1?'Vainqueurs ex æquo':'Vainqueur'}</small><strong>${winners.map(player=>esc(player.name)).join(' · ')}</strong></span></span>`:'<span><small>Tournoi interrompu</small><strong>Aucun vainqueur</strong></span>'}<button class="historyAction" onclick="openHistoryReview('${h.id}')">Revoir les tours →</button></div>`}).join(''):'<div class="empty"><b>Aucun tournoi terminé</b>Les résultats apparaîtront ici après le quatrième tour.</div>'}</div></section>`}
    function openHistoryReview(historyId){reviewHistoryId=historyId;reviewRound=1;render()}
    function showHistoryRound(round){reviewRound=round;render()}
    function closeHistoryReview(){reviewHistoryId=null;reviewRound=null;render()}
    function historyReviewView(h){const shown=Math.max(1,Math.min(h.rounds.length,reviewRound||1)),ids=h.selectedIds?.length?h.selectedIds:[...new Set(h.rounds.flatMap(r=>r.flatMap(m=>[m.a,m.b])))],initialElo=h.initialElo||Object.fromEntries(ids.map(pid=>[pid,((h.roster||[]).find(p=>p.id===pid)||player(pid)).elo||1500])),t={selectedIds:ids,initialElo,rounds:h.rounds,round:5,completed:true},before={...t,rounds:t.rounds.slice(0,shown-1)},s=score(before),matches=t.rounds[shown-1]||[],groups=[...new Set(matches.map(m=>m.groupWins))].sort((a,b)=>b-a),resolve=pid=>(h.roster||[]).find(p=>p.id===pid)||player(pid),date=new Intl.DateTimeFormat('fr-FR').format(new Date(h.date+'T12:00:00'));return `<div class="reviewBar"><button onclick="closeHistoryReview()">← Retour à l’historique</button><strong>Tournoi du ${date}</strong></div><div class="roundTabs">${h.rounds.map((round,i)=>`<button class="${shown===i+1?'active':''}" onclick="showHistoryRound(${i+1})">Tour ${i+1}</button>`).join('')}</div>${pdfExportPanel(true)}<section class="round"><div class="intro"><div><p class="kicker reviewLabel">Consultation · Tour ${shown} · ${matches.length} matchs</p><h2>Résultats du tour</h2><p>Les résultats sont affichés en lecture seule.</p></div></div>${groups.map(g=>`<div class="groupTitle"><span>${g} victoire${g>1?'s':''}</span><span>${matches.filter(m=>m.groupWins===g).length} matchs</span></div><div class="matches">${matches.filter(m=>m.groupWins===g).map((m,i)=>matchCard(m,i,s,true,resolve)).join('')}</div>`).join('')}<div class="roundfoot"><span>${matches.filter(m=>m.winner).length} / ${matches.length} résultats saisis</span><button class="secondary" onclick="closeHistoryReview()">← Retour à l’historique</button></div></section>`}
    function openData(){withdrawalModal=false;eloEditPlayerId=null;cleanupModal=false;editingDraw=false;swapSelection=null;modal=true;render()}function closeData(){modal=false;render()}
    function pastTournamentCount(){const ids=new Set(state.history.map(t=>t.id));if(state.active?.completed)ids.add(state.active.id);return ids.size}
    function dataModal(){const count=pastTournamentCount();return `<div class="modalBg" onclick="closeData()"><section class="modal" onclick="event.stopPropagation()"><button class="close" onclick="closeData()">×</button><h2>Vos données Ping</h2><p>Transférez l’effectif, le classement et l’historique vers un autre ordinateur avec un fichier JSON.</p><div class="modalActions"><button class="primary" onclick="exportData()">↓ Exporter une sauvegarde</button><button class="secondary" onclick="document.getElementById('importFile').click()">↑ Importer un fichier</button></div><small>Tout reste dans le stockage local de ce navigateur. Aucun serveur n’est utilisé.</small><div class="dangerZone"><strong>Effacer les tournois passés</strong><small>Cette opération est définitive. Exportez d’abord une sauvegarde si vous souhaitez pouvoir revenir en arrière.</small><button class="dangerButton" ${count?'':'disabled'} onclick="openHistoryCleanup()">Supprimer l’historique${count?` (${count})`:''}</button></div></section></div>`}
    function openHistoryCleanup(){const count=pastTournamentCount();if(!count){notice('Aucun tournoi passé à supprimer.');return}modal=false;cleanupKeepPlayers=true;cleanupResetElo=false;cleanupModal=true;render()}
    function closeHistoryCleanup(){cleanupModal=false;modal=true;render()}
    function toggleCleanupPlayers(){if(state.active&&!state.active.completed)return;cleanupKeepPlayers=!cleanupKeepPlayers;if(!cleanupKeepPlayers)cleanupResetElo=false;render()}
    function toggleCleanupReset(){if(state.active&&!state.active.completed||!cleanupKeepPlayers)return;cleanupResetElo=!cleanupResetElo;render()}
    function historyCleanupDialog(){const count=pastTournamentCount(),ongoing=state.active&&!state.active.completed,playersLocked=Boolean(ongoing),resetLocked=playersLocked||!cleanupKeepPlayers;return `<div class="modalBg" onclick="closeHistoryCleanup()"><section class="modal cleanupModal" onclick="event.stopPropagation()"><button class="close" onclick="closeHistoryCleanup()">×</button><h2>Supprimer l’historique</h2><p>${count} tournoi${count>1?'s':''} ${count>1?'seront supprimés':'sera supprimé'} définitivement.</p><div class="cleanupOptions"><button class="cleanupOption ${cleanupKeepPlayers?'on':''} ${playersLocked?'disabled':''}" ${playersLocked?'disabled':''} onclick="toggleCleanupPlayers()"><span class="check">${cleanupKeepPlayers?'✓':''}</span><span><strong>Conserver la liste des joueurs</strong><small>Décochez pour repartir avec un effectif vide.</small></span></button><button class="cleanupOption ${cleanupResetElo?'on':''} ${resetLocked?'disabled':''}" ${resetLocked?'disabled':''} onclick="toggleCleanupReset()"><span class="check">${cleanupResetElo?'✓':''}</span><span><strong>Réinitialiser tous les Elo à 1500</strong><small>Disponible uniquement si la liste des joueurs est conservée.</small></span></button></div>${ongoing?'<div class="cleanupWarning">Un tournoi est en cours : ses participants et leurs Elo sont protégés. Seul l’historique des tournois précédents sera supprimé.</div>':'<div class="cleanupWarning">Les résultats et les PDF des tournois supprimés ne pourront plus être récupérés sans sauvegarde JSON.</div>'}<div class="withdrawActions"><button class="secondary" onclick="closeHistoryCleanup()">Annuler</button><button class="primary dangerConfirm" onclick="purgeTournamentHistory()">Supprimer ${count} tournoi${count>1?'s':''}</button></div></section></div>`}
    function purgeTournamentHistory(){const count=pastTournamentCount(),ongoing=state.active&&!state.active.completed,keepPlayers=ongoing?true:cleanupKeepPlayers,resetElo=keepPlayers&&!ongoing&&cleanupResetElo;state.history=[];if(state.active?.completed){state.active=null;selected=[]}if(!keepPlayers){state.players=[];selected=[]}else if(resetElo)state.players=state.players.map(p=>({...p,elo:1500}));reviewRound=null;reviewHistoryId=null;cleanupModal=false;modal=false;save();render();const details=!keepPlayers?'Effectif supprimé.':resetElo?'Joueurs conservés, Elo réinitialisés à 1500.':'Joueurs et Elo conservés.';notice(`${count} tournoi${count>1?'s supprimés':' supprimé'}. ${details}`)}
    function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ping-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);notice('Sauvegarde exportée.')}
    document.getElementById('importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{recoveryRaw=String(r.result);state=sanitize(JSON.parse(recoveryRaw));selected=state.active?.selectedIds||[];reviewRound=null;reviewHistoryId=null;withdrawalModal=false;withdrawalSelected=[];eloEditPlayerId=null;cleanupModal=false;editingDraw=false;swapSelection=null;save();modal=false;render();notice('Sauvegarde importée et vérifiée.')}catch(err){notice('Fichier de sauvegarde invalide. Aucune donnée n’a été modifiée.')}};r.readAsText(f);e.target.value=''})
    render();if(startupWarning)setTimeout(()=>notice(startupWarning),0);
  </script>
