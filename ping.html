    function rulesView(){return `<section class="card page"><div class="sectionhead"><div><p class="kicker">Règlement complet</p><h2>Comment fonctionne le tournoi&nbsp;?</h2></div><span class="pill">4 tours · Elo K24</span></div><div class="rulesLead">Chaque tournoi se joue normalement en quatre tours. Avant de commencer, l’organisateur sélectionne les joueurs présents. Les appariements cherchent à faire jouer des adversaires de niveau différent au premier tour, puis des joueurs ayant le même nombre de victoires aux tours suivants, tout en évitant les revanches.</div><div class="rulesGrid">
      <article class="ruleBlock"><span class="ruleNum">1</span><h3>Présences et lancement</h3><ul><li>Seuls les membres cochés dans «&nbsp;Qui joue aujourd’hui&nbsp;?&nbsp;» participent au tournoi.</li><li>Le classement Elo détermine l’ordre des têtes de série et départage les choix de repêchage.</li><li>Dans le déroulement normal, chaque joueur dispute un match par tour, sauf le volontaire du groupe à 0 victoire.</li><li>Un tournoi s’arrête après le quatrième tour, ou plus tôt s’il reste moins de deux joueurs en lice.</li></ul></article>
      <article class="ruleBlock"><span class="ruleNum">2</span><h3>Formation des groupes</h3><ul><li>Avant chaque tour, les joueurs sont regroupés selon leur nombre V de victoires comptabilisées dans le tournoi.</li><li>Au premier tour, tous les joueurs appartiennent donc au groupe V&nbsp;=&nbsp;0.</li><li>Dans chaque groupe, la moitié la mieux classée à l’Elo provisoire rencontre, par tirage, la moitié la moins bien classée.</li><li>Après le troisième tour, les groupes possibles sont V&nbsp;=&nbsp;3, 2, 1 et 0.</li></ul></article>
      <article class="ruleBlock"><span class="ruleNum">3</span><h3>Repêchages montants</h3><ul><li>Si le groupe V est impair et V&nbsp;&gt;&nbsp;0, le meilleur Elo provisoire du groupe V−1 est repêché dans le groupe V.</li><li>Ce joueur est retiré du groupe V−1 et ne dispute qu’un seul match pendant le tour.</li><li>L’opération est appliquée du groupe le plus élevé vers le groupe V&nbsp;=&nbsp;1 et peut donc se propager entre plusieurs groupes.</li><li>Une victoire du joueur repêché est comptée normalement dans son total.</li></ul></article>
      <article class="ruleBlock"><span class="ruleNum">4</span><h3>Volontaire du groupe V = 0</h3><ul><li>Si le groupe V&nbsp;=&nbsp;0 reste impair, l’organisateur choisit un volontaire dans un groupe V&nbsp;&gt;&nbsp;0. Au premier tour, il peut choisir n’importe quel joueur présent.</li><li>Le volontaire conserve son match normal et joue un second match dans le groupe V&nbsp;=&nbsp;0.</li><li>S’il gagne ce match supplémentaire, cette victoire n’est pas ajoutée à son total. Si son adversaire gagne, sa victoire est comptée normalement.</li><li>Le résultat du match fait évoluer l’Elo des deux joueurs, comme toute rencontre jouée.</li></ul><p class="ruleNote">Le match supplémentaire du volontaire est la seule rencontre autorisée à reproduire une affiche déjà jouée pendant le tournoi.</p></article>
      <article class="ruleBlock"><span class="ruleNum">5</span><h3>Pas de revanche</h3><ul><li>Deux joueurs ne peuvent pas se rencontrer plus d’une fois au cours du même tournoi, sauf dans le match supplémentaire du volontaire.</li><li>Le tirage recherche d’abord des rencontres strictement internes aux groupes de victoires.</li><li>Si cela ne permet pas d’apparier tout le monde sans revanche, l’application autorise le plus petit écart nécessaire entre groupes.</li><li>Ces rencontres exceptionnelles sont signalées dans le tableau par la mention «&nbsp;Anti-revanche&nbsp;».</li></ul></article>
      <article class="ruleBlock"><span class="ruleNum">6</span><h3>Tirage et résultats</h3><ul><li>Tant qu’au moins deux rencontres restent à jouer, «&nbsp;Modifier le tirage&nbsp;» permet d’échanger manuellement deux joueurs entre des matchs non joués.</li><li>Les matchs déjà joués sont verrouillés. Une modification créant un auto-match ou une revanche interdite est refusée.</li><li>Le rôle de volontaire suit le joueur lors d’un échange et les modifications manuelles sont signalées dans le tableau.</li><li>Après chaque rencontre, l’organisateur clique sur le vainqueur. Il peut corriger ce choix en cliquant ensuite sur l’autre joueur.</li></ul></article>
      <article class="ruleBlock"><span class="ruleNum">7</span><h3>Elo et classement final</h3><ul><li>Chaque match joué fait évoluer l’Elo avec un coefficient K&nbsp;=&nbsp;24, y compris le match supplémentaire du volontaire.</li><li>L’Elo est recalculé rencontre après rencontre, dans l’ordre où les tours et les matchs sont enregistrés.</li><li>Le classement final trie d’abord les joueurs encore en lice par nombre de victoires, puis par Elo provisoire.</li><li>À la fin, les nouveaux Elo deviennent le classement du club utilisé au tournoi suivant.</li></ul></article>
      <article class="ruleBlock"><span class="ruleNum">8</span><h3>Départs, historique et données</h3><ul><li>«&nbsp;Départs / blessures&nbsp;» permet de retirer un ou plusieurs joueurs pendant un tour.</li><li>Leurs résultats déjà saisis restent acquis&nbsp;; leurs matchs non joués sont annulés et le reste du tour est recalculé sans victoire ni variation Elo artificielle.</li><li>Les tours peuvent être consultés pendant le tournoi et depuis l’historique après sa fin. Un abandon est indiqué dans le classement final.</li><li>Effectif, Elo, tournoi en cours et historique restent dans le stockage local du navigateur. L’import/export JSON permet de les transférer ou de les sauvegarder.</li></ul></article>
    </div><div class="rulesFoot"><strong>En résumé&nbsp;:</strong> le nombre de victoires organise les groupes du tournoi, tandis que l’Elo ordonne les joueurs, guide les appariements et assure le classement permanent d’une semaine à l’autre. Aucune donnée n’est envoyée à un serveur.</div></section>`}
    function historyView(){if(reviewHistoryId){const item=state.history.find(h=>h.id===reviewHistoryId);if(item)return historyReviewView(item);reviewHistoryId=null}return `<section class="card page"><div class="sectionhead"><div><p class="kicker">Archives locales</p><h2>Tournois précédents</h2></div></div><div class="rows">${state.history.length?state.history.map(h=>{const p=h.winner?((h.roster||[]).find(x=>x.id===h.winner)||player(h.winner)):null,date=new Intl.DateTimeFormat('fr-FR').format(new Date(h.date+'T12:00:00'));return`<div class="history"><span><strong>${date}</strong><small>${h.playerCount} joueurs · ${h.rounds.flat().length} matchs</small></span>${p?`<span class="who">${avatar(p)}<span><small>Vainqueur</small><strong>${esc(p.name)}</strong></span></span>`:'<span><small>Tournoi interrompu</small><strong>Aucun vainqueur</strong></span>'}<button class="historyAction" onclick="openHistoryReview('${h.id}')">Revoir les tours →</button></div>`}).join(''):'<div class="empty"><b>Aucun tournoi terminé</b>Les résultats apparaîtront ici après le quatrième tour.</div>'}</div></section>`}

    function showHistoryRound(round){reviewRound=round;render()}
    function closeHistoryReview(){reviewHistoryId=null;reviewRound=null;render()}
    function historyReviewView(h){const shown=Math.max(1,Math.min(h.rounds.length,reviewRound||1)),ids=h.selectedIds?.length?h.selectedIds:[...new Set(h.rounds.flatMap(r=>r.flatMap(m=>[m.a,m.b])))],initialElo=h.initialElo||Object.fromEntries(ids.map(pid=>[pid,((h.roster||[]).find(p=>p.id===pid)||player(pid)).elo||1500])),t={selectedIds:ids,initialElo,rounds:h.rounds,round:5,completed:true},before={...t,rounds:t.rounds.slice(0,shown-1)},s=score(before),matches=t.rounds[shown-1]||[],groups=[...new Set(matches.map(m=>m.groupWins))].sort((a,b)=>b-a),resolve=pid=>(h.roster||[]).find(p=>p.id===pid)||player(pid),date=new Intl.DateTimeFormat('fr-FR').format(new Date(h.date+'T12:00:00'));return `<div class="reviewBar"><button onclick="closeHistoryReview()">← Retour à l’historique</button><strong>Tournoi du ${date}</strong></div><div class="roundTabs">${h.rounds.map((round,i)=>`<button class="${shown===i+1?'active':''}" onclick="showHistoryRound(${i+1})">Tour ${i+1}</button>`).join('')}</div><section class="round"><div class="intro"><div><p class="kicker reviewLabel">Consultation · Tour ${shown} · ${matches.length} matchs</p><h2>Résultats du tour</h2><p>Les résultats sont affichés en lecture seule.</p></div></div>${groups.map(g=>`<div class="groupTitle"><span>${g} victoire${g>1?'s':''}</span><span>${matches.filter(m=>m.groupWins===g).length} matchs</span></div><div class="matches">${matches.filter(m=>m.groupWins===g).map((m,i)=>matchCard(m,i,s,true,resolve)).join('')}</div>`).join('')}<div class="roundfoot"><span>${matches.filter(m=>m.winner).length} / ${matches.length} résultats saisis</span><button class="secondary" onclick="closeHistoryReview()">← Retour à l’historique</button></div></section>`}
    function openData(){withdrawalModal=false;editingDraw=false;swapSelection=null;modal=true;render()}function closeData(){modal=false;render()}
    function dataModal(){return `<div class="modalBg" onclick="closeData()"><section class="modal" onclick="event.stopPropagation()"><button class="close" onclick="closeData()">×</button><h2>Vos données Ping</h2><p>Transférez l’effectif, le classement et l’historique vers un autre ordinateur avec un fichier JSON.</p><div class="modalActions"><button class="primary" onclick="exportData()">↓ Exporter une sauvegarde</button><button class="secondary" onclick="document.getElementById('importFile').click()">↑ Importer un fichier</button></div><small>Tout reste dans le stockage local de ce navigateur. Aucun serveur n’est utilisé.</small></section></div>`}
    function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ping-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);notice('Sauvegarde exportée.')}
    document.getElementById('importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{recoveryRaw=String(r.result);state=sanitize(JSON.parse(recoveryRaw));selected=state.active?.selectedIds||[];reviewRound=null;reviewHistoryId=null;withdrawalModal=false;withdrawalSelected=[];editingDraw=false;swapSelection=null;save();modal=false;render();notice('Sauvegarde importée et vérifiée.')}catch(err){notice('Fichier de sauvegarde invalide. Aucune donnée n’a été modifiée.')}};r.readAsText(f);e.target.value=''})
    render();if(startupWarning)setTimeout(()=>notice(startupWarning),0);
  </script>
</body>
